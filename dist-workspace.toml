[workspace]
# The server (root) + the ccs TUI + the aggregator hub. Each produces its own
# `curl | sh` installer; the server and hub embed frontend/dist (built first by
# the github-build-setup step), and the hub then `cc-screen-hub install`s its
# service.
members = ["cargo:.", "cargo:crates/hub"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Steps run in each build job BEFORE `dist build`. The server embeds the React
# PWA via rust-embed (#[folder = "frontend/dist"]), so frontend/dist must exist
# before cargo compiles it. This sets up Node and builds the frontend.
# Path is relative to .github/workflows/; the leading ../ keeps the fragment in
# .github/ so GitHub doesn't try to run it as a (malformed) standalone workflow.
github-build-setup = "../build-setup.yml"
# The installers to generate for each app. `shell` emits the POSIX `curl | sh`
# scripts (cc-screen-tui-installer.sh + cc-screen-rust-installer.sh); `powershell`
# emits the Windows `irm … | iex` counterparts (…-installer.ps1) — run
# `cc-screen-rust install` after either to wire up the service (proposal 0045).
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
# mac (both arches) + Linux as static musl so the binary runs on any distro
# regardless of glibc version + Windows x64 (proposal 0045: ConPTY via portable-pty,
# crossterm ccs, rustls — all cross-platform; the OS-specific seams are #[cfg(windows)]).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in. ~/.local/bin matches the repo
# convention for ccs and works for users without a Rust toolchain (~/.cargo/bin
# may not exist); the installer adds it to PATH if missing.
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Build each target on our own hardware instead of GitHub-hosted runners. These
# are self-hosted runners on the tailnet (registered repo-level, unique labels),
# so the cross-build matrix runs natively in minutes with warm caches instead of
# queuing on shared VMs. Each label maps to one box:
#   ccs-mac    -> mac-studio   (macOS arm64; builds both Apple targets natively)
#   ccs-studio -> studio       (Linux aarch64; native aarch64 musl)
#   ccs-pine   -> pine         (Linux x86_64; native x86_64 musl)
# x86_64-pc-windows-msvc is deliberately UNMAPPED: there's no Windows box on the
# tailnet, so cargo-dist falls back to a GitHub-hosted `windows-latest` runner for
# that leg (proposal 0045 Part F — the zero-hardware start; register a self-hosted
# `ccs-win` label here later if volume warrants).
# The light plan/global/host jobs stay on GitHub-hosted ubuntu (they keep `gh`
# + publishing off our boxes and barely cost time). Runners dial OUT to GitHub
# (no inbound); the heavy build job is tag-gated so forked PRs never reach them.
[dist.github-custom-runners]
aarch64-apple-darwin = "ccs-mac"
x86_64-apple-darwin = "ccs-mac"
aarch64-unknown-linux-musl = "ccs-studio"
x86_64-unknown-linux-musl = "ccs-pine"
