<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
  <title id="t">How cc-screen fits together</title>
  <desc id="d">Phone, browser, and ccs clients connect to the hub at app.ccscreen.dev over HTTPS/WSS. Your machines dial out to the hub — no inbound ports. The hub owns no terminals and no files; code and files stay on your machines.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#76b360"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="560" fill="#060e09"/>

  <!-- zone headers -->
  <g font-size="13" letter-spacing="3" fill="#5f7060" text-anchor="middle">
    <text x="175" y="44">CLIENTS</text>
    <text x="600" y="44">THE HUB</text>
    <text x="1010" y="44">YOUR MACHINES</text>
  </g>

  <!-- ===== clients ===== -->
  <g>
    <!-- phone -->
    <rect x="60" y="92" width="230" height="72" rx="9" fill="#0a1510" stroke="#76b360" stroke-opacity="0.22"/>
    <g stroke="#8ac471" stroke-width="1.5" fill="none">
      <rect x="87" y="113" width="17" height="30" rx="3.5"/>
      <line x1="92.5" y1="138.5" x2="98.5" y2="138.5"/>
    </g>
    <text x="122" y="134" font-size="17" fill="#edf3ea">Phone <tspan fill="#9db098">(PWA)</tspan></text>

    <!-- browser -->
    <rect x="60" y="244" width="230" height="72" rx="9" fill="#0a1510" stroke="#76b360" stroke-opacity="0.22"/>
    <g stroke="#8ac471" stroke-width="1.5" fill="none">
      <rect x="83" y="268" width="26" height="24" rx="3"/>
      <line x1="83" y1="275.5" x2="109" y2="275.5"/>
      <circle cx="88" cy="271.8" r="0.8" fill="#8ac471" stroke="none"/>
      <circle cx="92.5" cy="271.8" r="0.8" fill="#8ac471" stroke="none"/>
    </g>
    <text x="122" y="286" font-size="17" fill="#edf3ea">Browser</text>

    <!-- ccs terminal -->
    <rect x="60" y="396" width="230" height="72" rx="9" fill="#0a1510" stroke="#76b360" stroke-opacity="0.22"/>
    <g stroke="#8ac471" stroke-width="1.5" fill="none">
      <rect x="83" y="420" width="26" height="24" rx="3"/>
      <polyline points="88,428 93,432 88,436"/>
      <line x1="96" y1="437" x2="103" y2="437"/>
    </g>
    <text x="122" y="438" font-size="17" fill="#edf3ea">ccs <tspan fill="#9db098">(terminal)</tspan></text>
  </g>

  <!-- ===== clients → hub ===== -->
  <g stroke="#76b360" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <path d="M292 128 C 380 128, 396 238, 470 238" marker-end="url(#ah)"/>
    <path d="M292 280 L 470 280" marker-end="url(#ah)"/>
    <path d="M292 432 C 380 432, 396 322, 470 322" marker-end="url(#ah)"/>
  </g>
  <text x="384" y="264" font-size="14" fill="#9db098" text-anchor="middle">HTTPS / WSS</text>

  <!-- ===== the hub ===== -->
  <g>
    <rect x="480" y="170" width="240" height="220" rx="12" fill="#0d1c12" stroke="#76b360" stroke-opacity="0.4"/>
    <circle cx="530" cy="214" r="4" fill="#76b360"/>
    <text x="546" y="221" font-size="21" fill="#edf3ea">hub</text>
    <text x="600" y="253" font-size="14" fill="#a4d48f" text-anchor="middle">app.ccscreen.dev</text>
    <line x1="504" y1="278" x2="696" y2="278" stroke="#76b360" stroke-opacity="0.12"/>
    <text x="600" y="312" font-size="14" fill="#9db098" text-anchor="middle">no terminals, no files</text>
    <text x="600" y="336" font-size="14" fill="#9db098" text-anchor="middle">— a relay</text>
    <text x="600" y="368" font-size="13" fill="#5f7060" text-anchor="middle">relays each request</text>
  </g>

  <!-- ===== machines → hub (dial out) ===== -->
  <g stroke="#76b360" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <path d="M878 159 C 800 159, 792 238, 730 238" marker-end="url(#ah)"/>
    <path d="M878 399 C 800 399, 792 322, 730 322" marker-end="url(#ah)"/>
  </g>
  <text x="801" y="268" font-size="14" fill="#8ac471" text-anchor="middle">dials out —</text>
  <text x="801" y="290" font-size="14" fill="#8ac471" text-anchor="middle">no inbound ports</text>

  <!-- ===== machines ===== -->
  <g>
    <!-- pine -->
    <rect x="880" y="100" width="260" height="118" rx="9" fill="#0a1510" stroke="#76b360" stroke-opacity="0.22"/>
    <circle cx="906" cy="129" r="4" fill="#76b360"/>
    <text x="922" y="135" font-size="16" fill="#edf3ea">pine <tspan fill="#9db098">— Linux</tspan></text>
    <text x="906" y="169" font-size="14" fill="#9db098"><tspan fill="#5f7060">❯</tspan> claude · web-app</text>
    <text x="906" y="193" font-size="14" fill="#9db098"><tspan fill="#5f7060">❯</tspan> codex · release</text>

    <!-- harebell -->
    <rect x="880" y="340" width="260" height="118" rx="9" fill="#0a1510" stroke="#76b360" stroke-opacity="0.22"/>
    <circle cx="906" cy="369" r="4" fill="none" stroke="#5f7060" stroke-width="1.5"/>
    <text x="922" y="375" font-size="16" fill="#edf3ea">harebell <tspan fill="#9db098">— Windows</tspan></text>
    <text x="906" y="409" font-size="14" fill="#9db098"><tspan fill="#5f7060">❯</tspan> claude · win-port</text>
    <text x="906" y="433" font-size="14" fill="#9db098"><tspan fill="#5f7060">❯</tspan> shell</text>
  </g>

  <!-- lock note -->
  <g>
    <g stroke="#5f7060" stroke-width="1.4" fill="none">
      <rect x="898" y="500" width="13" height="10" rx="2"/>
      <path d="M900.5 500 v-3.5 a4 4 0 0 1 8 0 v3.5"/>
    </g>
    <text x="922" y="510" font-size="14" fill="#5f7060">code and files stay here</text>
  </g>
</svg>
