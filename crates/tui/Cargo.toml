[package]
name = "cc-screen-tui"
version = "0.5.6"
edition = "2021"
license.workspace = true
description = "Terminal client for cc-screen-rust"
repository = "https://github.com/dibbla-agents/cc-screen-rust"

# `ccs` is the pure-Rust, rustls-based terminal client — the one binary we ship
# as cross-platform release artifacts (mac + linux) for the `curl | sh` installer.
[package.metadata.dist]
dist = true

[[bin]]
name = "ccs"
path = "src/main.rs"

[features]
# B4 PTY smoke (proposal 0059): the flaky tier. Quarantined behind a feature so a
# plain `cargo test -p cc-screen-tui` (the blocking CI job) never runs it; CI runs
# it as a separate, isolated step: `--features pty-smoke --test pty_smoke`.
pty-smoke = []

[dependencies]
cc-screen-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
alacritty_terminal = "0.26"
unicode-width = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# 0077 Part C: re-encode a captured clipboard write as OSC 52 for the host
# terminal. Same version the rest of the workspace pins.
base64 = "0.22"

[dev-dependencies]
# The e2e harness (proposal 0059 B3/B4) drives a real `App` against an in-process
# hub built from the SAME wire-contract doubles the hub's own suite uses — hoisted
# into cc_screen_hub::test_support (B1). Pulling the hub in with `test-support`
# also means `frontend/dist` must exist before `cargo test -p cc-screen-tui`
# compiles (the hub embeds it via rust-embed) — the tui-ci job builds it first.
# 0060 adds `multi-tenant` so the harness can start a real multi-tenant hub
# (`start_hub_multi`) and drive `ccs activate` end-to-end — the compile cost of
# sqlx in the TUI's dev graph is accepted and noted (proposal 0060 Wave 0).
cc-screen-hub = { path = "../hub", features = ["test-support", "multi-tenant"] }
cc-screen-auth = { path = "../auth" }
# B4 PTY smoke: boot the real `ccs` binary inside a pty pair and read its screen.
portable-pty = "0.8"
# 0060: a hand-rolled "pre-0060 hub" double (answers /api/me, 404s the client
# device flow) for the degradation-matrix e2e. Already in the dev graph via hub.
axum = "0.7"
